    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

        <title>Login </title>

        <style>           

            html{
                font-family: 'Poppins';
                background: linear-gradient(140deg, rgb(170, 57, 0),rgb(132, 129, 73));
                -webkit-font-smoothing: subpixel-antialiased;
            }
            .body{
                width: 50%;
                margin: auto;
                margin-top:-90px;
                background-color: #ffff;
                scale: 70%;
                padding: 20px;
                border-radius: 15px;
                box-shadow: 0px 3px 20px rgba(0, 0, 0, 0.504);
            }

            h3{
                text-align: center;
                font-size: 40px;
                color: #FF4000; 
                text-decoration: underline 2px  #ffa268;
                text-underline-offset: 5px;
            }

            img{
                width: 50px;
                margin-bottom: -6px;
                margin-left: 7px;
            }

            h5{
                font-size: 20px;
                margin-bottom: 5px;
                color: rgb(49, 49, 49);
            }

            hr{
                width: 500px;
                padding-left: 110px;
                filter: blur(1.5px);
                border-color: rgb(239, 239, 239);
                opacity: 60%;
            }

            input{
                color: brown;
                width: 300px;
                border: none;
                border-radius: 5px;
                outline: none;
                transition: 0.3s;
                border-left: 2px solid orangered;
                border-width: 6px;
                font-size: 23px;
                padding-left: 10px;

                &:focus{
                    border-bottom: 0.1px solid orangered;
                    border-left: none;
                }
                &:valid{
                    border-bottom: 0.1px solid orangered;
                    border-left: none;
                }
            }


            input::placeholder{
            font-family: 'Manjari';
            font-size: 20px;
            letter-spacing: 0.5px;
            opacity:65%;
            }

            .Login{
                color: #000000;
                border:5px #848484;
                font-size: 19px;
                font-family: 'poppins';
                font-weight: 300;
                text-decoration: underline;
                border: none;
                border-radius: 20px;
                padding-left: 38px;
                padding-right: 50px;
                transition: 0.2s;

                &:hover{
                    color: rgb(255, 255, 255);
                    background-color: #848484;
                    border-radius: 10px;
                }
            }

            .submit{
                font-family: 'Poppins';
                font-size: 30px;
                padding-right: 20px;
                padding-left: 20px;
                width: 150px;
                border: none;
                border-radius: 20px;
                background-color: #FF4000;
                margin-bottom: 8px;
                padding-top: 0px;
                color: rgb(255, 255, 255);
                box-shadow:  4px 5px 9px rgba(45, 65, 64, 0.565);
                transition:0.2s;

                &:hover{
                    color: #874d02;
                    background: #fdebd3;
                    border: 1px solid #874d02;  
                }

            }

            .Submit{
                padding-top: 5px;
                text-align: right;
                margin: 40px;
                margin-top: 35px;
            }

            label{
                background-color: rgba(0, 255, 255, 0.3);
                padding:5px;
                padding-bottom: 3px;
                border-radius: 8px;
                font-size: 60%;
                font-weight: 800;
            }
            
            h6{
                font-size: large;
                color: red;
                font-weight:bolder;
                text-align: center;
                transform: translateX(23);
                transition: 0.5s;
            }

            .checkbox{
                margin: -120px; 
                accent-color: red;
                font-size: 60px;
            }

        </style>
    </head>

    <body>
        <div class="body" >
            <h3 >Create your Account <img src="./GoogleMaterial ic account circle 18px.svg.png"></h3>

            <h5>
                Username
            </h5>
            <input type="text" class="input" placeholder="enter your name" required>

            <hr>
            
            <h5>
                Email 
            </h5>
            <input type="email" class="input" placeholder="enter your email address" required autocomplete="off">

            <hr>
            
            <h5>
                Password
            </h5>
            <input type="password" id="pass" class="input" placeholder="enter your password" required>
            <label id="label" for="password" onclick="after() " >SHOW</label>

            <hr>
            
            <h5>
                Confirm Password
            </h5>
            <input type="password" id="confirm-pass" class="input" placeholder="confirm your password" required>

            <hr>

            <h6 class="ifpassnmatch"></h6>

            <input type="checkbox" class="checkbox" required >I agree with terms & conditions
            <div class="Submit">
            <button type="submit" class="submit" value="Submit" >Submit</button>

            <div>
            <button type="button" class="Login" value="">Sign in</button>
            </div>
            </div>

        </div>
    </body>

    <script>
        function after() {
            var passwordInput = document.getElementById('pass');
            if (passwordInput.type == 'password') {
                passwordInput.type = 'text';
            } else {
                passwordInput.type = 'password';
            }

            var confirmpass= document.getElementById('confirm-pass');
            if(confirmpass.type =='password'){
                confirmpass.type='text';
            }
            else{
                confirmpass.type='password';
            }

            var hide="Hide";
            var show="Show";
            if(confirmpass.type =='text' || passwordInput.type=='text'){
                document.querySelector('label').innerHTML=hide;

            }
            else{
            document.querySelector('label').innerHTML=show;            
            }

        }
        
        document.querySelector('button').addEventListener('click',checkPass)

        function checkPass(){
            var firstpass= document.getElementById('pass').value;
            var confmpass= document.getElementById('confirm-pass').value;
            var notmatch ="Your Passwords does not match!";


            if(firstpass !== confmpass) {
                document.querySelector('h6').innerHTML=notmatch;
            }
            else{
                document.querySelector('h6').innerHTML="";
            }


    }
    </script>

    </html>
